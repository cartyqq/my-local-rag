services:
  rag-app:
    build: .
    container_name: local_rag_ui
    ports:
      # Bound to localhost only, so the UI is not exposed to your network
      - "127.0.0.1:8501:8501"
    volumes:
      # Persist the vector database between restarts
      - ./chroma_db:/app/chroma_db
    environment:
      # Ollama runs on the host; host.docker.internal points to it from the container
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # The embedding model is baked into the image, so never contact HuggingFace Hub
      - HF_HUB_OFFLINE=1
    extra_hosts:
      # Required on Linux; harmless on Windows and macOS
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
